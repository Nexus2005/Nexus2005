<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a" />
      <stop offset="50%" stop-color="#121212" />
      <stop offset="100%" stop-color="#161616" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(245, 245, 245, 0.02)" stroke-width="1" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Linear Gradient for Accents -->
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c6ff38" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8ce62c" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="400" fill="url(#bgGrad)" />

  <!-- Technical Grid Overlay -->
  <rect width="1200" height="400" fill="url(#grid)" />

  <!-- Animated Ambient Circles -->
  <circle cx="200" cy="150" r="120" fill="#c6ff38" opacity="0.015" filter="url(#glow)">
    <animate attributeName="r" values="120;140;120" dur="8s" repeatCount="indefinite" />
  </circle>
  <circle cx="1000" cy="250" r="160" fill="#2d3eff" opacity="0.01" filter="url(#glow)">
    <animate attributeName="r" values="160;190;160" dur="10s" repeatCount="indefinite" />
  </circle>

  <!-- Cybernetic Node Lines -->
  <g stroke="rgba(245, 245, 245, 0.05)" stroke-width="1" fill="none">
    <path d="M -50 200 L 300 200 L 380 280 L 700 280 L 750 230 L 1250 230" />
    <path d="M 150 0 L 150 150 L 220 220 L 500 220 L 550 170 L 550 -50" />
    <path d="M 850 450 L 850 300 L 930 220 L 1250 220" />
  </g>

  <!-- Highlight Nodes with Glowing FX -->
  <g fill="none">
    <line x1="300" y1="200" x2="380" y2="280" stroke="#c6ff38" stroke-width="2" filter="url(#glow)" opacity="0.6" />
    <line x1="700" y1="280" x2="750" y2="230" stroke="#2d3eff" stroke-width="2" filter="url(#glow)" opacity="0.6" />
    
    <!-- Active Pulse Nodes -->
    <circle cx="300" cy="200" r="4" fill="#c6ff38" filter="url(#glow)">
      <animate attributeName="r" values="4;7;4" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="380" cy="280" r="4" fill="#c6ff38" />
    <circle cx="700" cy="280" r="4" fill="#2d3eff" filter="url(#glow)">
      <animate attributeName="r" values="4;7;4" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="750" cy="230" r="4" fill="#2d3eff" />
  </g>

  <!-- Technical Telemetry & Borders -->
  <g font-family="monospace" font-size="9" fill="rgba(245, 245, 245, 0.2)" letter-spacing="1.5">
    <text x="30" y="40">[ NODE_STATUS: ONLINE ]</text>
    <text x="30" y="60">[ LOC: NASHIK_INDIA_NODE_V3 ]</text>
    <text x="1000" y="40" text-anchor="end">SYSCORE // PORT: 8080</text>
    <text x="1000" y="60" text-anchor="end">ML_INFERENCE_ENG // B.E. COMP</text>
  </g>

  <!-- Central Brand Header -->
  <g transform="translate(600, 190)" text-anchor="middle">
    <!-- Main Hacker Aesthetic Username -->
    <text y="-25" font-family="'Space Mono', monospace, sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="8" style="text-shadow: 0 0 20px rgba(255,255,255,0.1)">NEXUS2005</text>
    
    <!-- Sub-label -->
    <text y="20" font-family="'Space Mono', monospace, sans-serif" font-size="14" font-weight="700" fill="#c6ff38" letter-spacing="6" opacity="0.9">BACKEND &amp; SYSTEMS ENGINEER // ML R&amp;D</text>

    <!-- Underline telemetry divider -->
    <line x1="-180" y1="40" x2="180" y2="40" stroke="url(#limeGrad)" stroke-width="1.5" />
    <circle cx="0" cy="40" r="3.5" fill="#c6ff38" filter="url(#glow)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.5s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Corner Graphic Brackets -->
  <path d="M 20 50 L 20 20 L 50 20" stroke="rgba(245, 245, 245, 0.15)" stroke-width="1.5" fill="none" />
  <path d="M 1180 50 L 1180 20 L 1150 20" stroke="rgba(245, 245, 245, 0.15)" stroke-width="1.5" fill="none" />
  <path d="M 20 350 L 20 380 L 50 380" stroke="rgba(245, 245, 245, 0.15)" stroke-width="1.5" fill="none" />
  <path d="M 1180 350 L 1180 380 L 1150 380" stroke="rgba(245, 245, 245, 0.15)" stroke-width="1.5" fill="none" />
</svg>
